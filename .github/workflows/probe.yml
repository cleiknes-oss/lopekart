name: Probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "https://wms.geonorge.no/skwms1/wms.turogfriluftsruter" "https://wms.geonorge.no/skwms1/wms.friluftsruter2" "https://wms.geonorge.no/skwms1/wms.friluftsruter"; do
            echo "== $u"; curl -s -m 30 "$u?service=WMS&request=GetCapabilities&version=1.3.0" | grep -o "<Name>[^<]*</Name>\|<Title>[^<]*</Title>\|<ServiceException[^<]*" | head -30
          done
          echo "== WFS count Enebakk fotrute"
          curl -s -m 60 "https://wfs.geonorge.no/skwms1/wfs.turogfriluftsruter?service=WFS&version=2.0.0&request=GetFeature&typeNames=app:Fotrute&count=2&bbox=59.70,10.95,59.85,11.30,urn:ogc:def:crs:EPSG::4326" | head -c 1500
